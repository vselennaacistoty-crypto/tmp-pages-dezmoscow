      <stop offset="0" stop-color="#1a679c" stop-opacity=".0"/>
      <stop offset=".18" stop-color="#1a659a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#175d90"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#175f93" stop-opacity=".0"/>
      <stop offset=".16" stop-color="#165b8e" stop-opacity=".92"/>
      <stop offset="1" stop-color="#135283"/>
    </linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#134f80" stop-opacity=".0"/>
      <stop offset=".2" stop-color="#124d7d" stop-opacity=".95"/>
